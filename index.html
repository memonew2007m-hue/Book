<!-- قسم الملازم الدراسية -->
<div id="malazim-section">
  <h2>الملازم الدراسية (المنهج العراقي)</h2>

  <!-- 1. أزرار المراحل الرئيسية -->
  <div class="stages-container">
    <button onclick="showGrades('primary')">المرحلة الابتدائية</button>
    <button onclick="showGrades('intermediate')">المرحلة المتوسطة</button>
    <button onclick="showGrades('preparatory')">المرحلة الإعدادية</button>
  </div>

  <!-- 2. حاوية الصفوف الدراسية (تظهر حسب المرحلة المختارة) -->
  <div id="grades-container" class="grades-container" style="display: none;"></div>

  <!-- 3. حاوية المواد الدراسية (تظهر حسب الصف المختار) -->
  <div id="subjects-container" class="subjects-container" style="display: none;"></div>
</div>

<script>
// بيانات الصفوف والمواد الدراسية للمنهج العراقي
const curriculumData = {
  primary: {
    "الأول ابتدائي": ["الاسلامية", "القراءة", "الرياضيات", "العلوم", "الإنكليزي"],
    "الثاني ابتدائي": ["الاسلامية", "القراءة", "الرياضيات", "العلوم", "الإنكليزي"],
    "الثالث ابتدائي": ["الاسلامية", "القراءة", "الرياضيات", "العلوم", "الإنكليزي"],
    "الرابع ابتدائي": ["الاسلامية", "اللغة العربية", "الرياضيات", "العلوم", "الاجتماعيات", "الإنكليزي"],
    "الخامس ابتدائي": ["الاسلامية", "اللغة العربية", "الرياضيات", "العلوم", "الاجتماعيات", "الإنكليزي"],
    "السادس ابتدائي": ["الاسلامية", "اللغة العربية", "الرياضيات", "العلوم", "الاجتماعيات", "الإنكليزي"]
  },
  intermediate: {
    "الأول متوسط": ["الاسلامية", "اللغة العربية", "الرياضيات", "العلوم", "الاجتماعيات", "الإنكليزي", "الحاسوب"],
    "الثاني متوسط": ["الاسلامية", "اللغة العربية", "الرياضيات", "العلوم", "الاجتماعيات", "الإنكليزي", "الحاسوب"],
    "الثالث متوسط": ["الاسلامية", "اللغة العربية", "الرياضيات", "الكيمياء", "الفيزياء", "الأحياء", "الاجتماعيات", "الإنكليزي", "الحاسوب"]
  },
  preparatory: {
    "الرابع إعدادي": ["الاسلامية", "اللغة العربية", "الإنكليزي", "الرياضيات", "الكيمياء", "الفيزياء", "الأحياء", "الاحياء / الأدبيات", "الحاسوب"],
    "الخامس إعدادي": ["الاسلامية", "اللغة العربية", "الإنكليزي", "الرياضيات", "الكيمياء", "الفيزياء", "الأحياء", "الحاسوب"],
    "السادس إعدادي": ["الاسلامية", "اللغة العربية", "الإنكليزي", "الرياضيات", "الكيمياء", "الفيزياء", "الأحياء", "الأنكليزي المكثف"]
  }
};

// دالة عرض الصفوف بناءً على المرحلة المختارة
function showGrades(stage) {
  const gradesContainer = document.getElementById('grades-container');
  const subjectsContainer = document.getElementById('subjects-container');
  
  gradesContainer.innerHTML = '';
  subjectsContainer.style.display = 'none'; // إخفاء المواد عند تغيير المرحلة
  gradesContainer.style.display = 'flex';

  const grades = curriculumData[stage];
  
  for (let gradeName in grades) {
    const btn = document.createElement('button');
    btn.innerText = gradeName;
    btn.onclick = () => showSubjects(stage, gradeName);
    gradesContainer.appendChild(btn);
  }
}

// دالة عرض المواد بناءً على الصف المختار
function showSubjects(stage, gradeName) {
  const subjectsContainer = document.getElementById('subjects-container');
  subjectsContainer.innerHTML = `<h3>مواضيع صف: ${gradeName}</h3>`;
  subjectsContainer.style.display = 'block';

  const subjects = curriculumData[stage][gradeName];
  
  const list = document.createElement('ul');
  subjects.forEach(subject => {
    const item = document.createElement('li');
    item.innerText = subject;
    // يمكنك إضافة رابط تحميل أو فتح الملازم هنا
    list.appendChild(item);
  });

  subjectsContainer.appendChild(list);
}
</script>
